version: '3.8'

services:
  backend:
    build: ./backend
    container_name: nlp-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./nlp/models:/app/nlp/models
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - nlp-network

  frontend:
    build: ./frontend
    container_name: nlp-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - nlp-network

networks:
  nlp-network:
    driver: bridge
